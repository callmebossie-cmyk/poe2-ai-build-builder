[project]
name = "poe2-ai-build-builder"
version = "0.1.0"
description = "Real-data core for a Path of Exile 2 AI-assisted build planner"
requires-python = ">=3.10"

[project.scripts]
poe2-data = "poe2_builder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
